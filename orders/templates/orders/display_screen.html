<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ shop.name }} - Order Token Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        header {
            background: #111827;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2937;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }
        .header-meta {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 24px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .fullscreen-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover {
            background: #334155;
            color: #fff;
        }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 32px;
        }
        .column {
            background: #111827;
            border-radius: 16px;
            border: 2px solid #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .column-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2937;
        }
        .column-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .col-preparing .column-header {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            border-bottom-color: rgba(245, 158, 11, 0.3);
        }
        .col-preparing .column-title {
            color: #fbbf24;
        }
        .col-ready .column-header {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(16, 185, 129, 0.05) 100%);
            border-bottom-color: rgba(16, 185, 129, 0.4);
        }
        .col-ready .column-title {
            color: #34d399;
        }
        .count-badge {
            background: #1e293b;
            font-size: 16px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 9999px;
            color: #cbd5e1;
        }
        .col-preparing .count-badge {
            background: #78350f;
            color: #fef3c7;
        }
        .col-ready .count-badge {
            background: #065f46;
            color: #d1fae5;
        }
        .token-grid {
            flex: 1;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            align-content: flex-start;
            overflow-y: auto;
        }
        .token-card {
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }
        .token-card .num {
            font-size: 34px;
            line-height: 1;
            display: block;
        }
        .token-card .sub {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
        .card-preparing {
            background: #1e293b;
            color: #fef3c7;
            border: 2px solid #b45309;
        }
        .card-ready {
            background: #064e3b;
            color: #a7f3d0;
            border: 2px solid #10b981;
            animation: readyPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        @keyframes readyPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 18px;
            font-weight: 500;
        }
        footer {
            background: #0f172a;
            border-top: 2px solid #1e293b;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            overflow: hidden;
        }
        .recent-label {
            font-size: 13px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .recent-tokens {
            display: flex;
            gap: 12px;
            overflow-x: auto;
        }
        .recent-chip {
            background: #1e293b;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: rgba(16, 185, 129, 0.15);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 999;
        }
        .flash-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="flashOverlay" class="flash-overlay"></div>

    <header>
        <div class="brand">
            <h1>{{ shop.name }}</h1>
            <span class="badge-live">
                <span class="pulse-dot"></span>
                LIVE QUEUE
            </span>
        </div>
        <div class="header-meta">
            <div class="clock" id="liveClock">--:--:--</div>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="fullscreen-btn" id="soundBtn" onclick="enableAudio()">🔔 Enable Sound</button>
        </div>
    </header>

    <main>
        <!-- PREPARING / WAITING COLUMN -->
        <section class="column col-preparing">
            <div class="column-header">
                <span class="column-title">⏳ Waiting &amp; Preparing</span>
                <span class="count-badge" id="prepCount">0</span>
            </div>
            <div class="token-grid" id="prepGrid">
                <div class="empty-message">No orders currently preparing</div>
            </div>
        </section>

        <!-- READY FOR PICKUP COLUMN -->
        <section class="column col-ready">
            <div class="column-header">
                <span class="column-title">✅ Ready for Pickup</span>
                <span class="count-badge" id="readyCount">0</span>
            </div>
            <div class="token-grid" id="readyGrid">
                <div class="empty-message">No orders ready for pickup</div>
            </div>
        </section>
    </main>

    <footer>
        <span class="recent-label">Recently Completed:</span>
        <div class="recent-tokens" id="recentChips">
            <span class="recent-chip">None</span>
        </div>
    </footer>

    <script>
        const SHOP_ID = {{ shop.id }};
        let audioCtx = null;
        let knownReadyTokens = new Set();
        let initialLoadDone = false;

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveClock').textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function enableAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playChime();
            document.getElementById('soundBtn').textContent = '🔔 Sound On';
            document.getElementById('soundBtn').style.background = '#065f46';
        }

        function playChime() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1046.5, now);
                gain1.gain.setValueAtTime(0.25, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.5);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1318.5, now + 0.15);
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.8);
            } catch (e) {
                console.log('Chime error:', e);
            }
        }

        function triggerReadyFlash() {
            const el = document.getElementById('flashOverlay');
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 600);
        }

        function renderData(data) {
            const prepGrid = document.getElementById('prepGrid');
            const readyGrid = document.getElementById('readyGrid');
            const prepCount = document.getElementById('prepCount');
            const readyCount = document.getElementById('readyCount');
            const recentChips = document.getElementById('recentChips');

            const preparingList = data.preparing || [];
            const readyList = data.ready || [];
            const recentList = data.recent_completed || [];

            prepCount.textContent = preparingList.length;
            readyCount.textContent = readyList.length;

            if (preparingList.length === 0) {
                prepGrid.innerHTML = '<div class="empty-message">No orders currently preparing</div>';
            } else {
                prepGrid.innerHTML = preparingList.map(item => `
                    <div class="token-card card-preparing">
                        <span class="num">#${escapeHtml(item.token_number)}</span>
                        <div class="sub">Preparing</div>
                    </div>
                `).join('');
            }

            let hasNewReady = false;
            readyList.forEach(item => {
                if (initialLoadDone && !knownReadyTokens.has(item.token_number)) {
                    hasNewReady = true;
                }
            });

            knownReadyTokens = new Set(readyList.map(i => i.token_number));

            if (hasNewReady) {
                playChime();
                triggerReadyFlash();
            }

            if (readyList.length === 0) {
                readyGrid.innerHTML = '<div class="empty-message">No orders ready for pickup</div>';
            } else {
                readyGrid.innerHTML = readyList.map(item => `
                    <div class="token-card card-ready">
                        <span class="num">#${escapeHtml(item.token_number)}</span>
                        <div class="sub">Ready Now!</div>
                    </div>
                `).join('');
            }

            if (recentList.length === 0) {
                recentChips.innerHTML = '<span class="recent-chip">None</span>';
            } else {
                recentChips.innerHTML = recentList.map(item => `
                    <span class="recent-chip">#${escapeHtml(item.token_number)}</span>
                `).join('');
            }

            initialLoadDone = true;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function fetchTokens() {
            try {
                const res = await fetch(`/orders/display-screen/?shop_id=${SHOP_ID}`);
                if (res.ok) {
                    const data = await res.json();
                    renderData(data);
                }
            } catch (err) {
                console.warn('Failed to fetch token screen data:', err);
            }
        }

        let ws = null;
        function connectWs() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${proto}//${window.location.host}/ws/display/${SHOP_ID}/`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('Connected to Display Screen WebSocket');
            };

            ws.onmessage = (evt) => {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.type === 'display_refresh') {
                        renderData(msg);
                    } else {
                        fetchTokens();
                    }
                } catch (e) {
                    fetchTokens();
                }
            };

            ws.onclose = () => {
                console.log('Display Screen WebSocket closed. Reconnecting in 3s...');
                setTimeout(connectWs, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        fetchTokens();
        connectWs();
        setInterval(fetchTokens, 6000);
    </script>
</body>
</html>
